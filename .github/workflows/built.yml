bname: Motorola Edge 50 Pro Kernel Builder

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev ImageMagick libelf-dev

      - name: Fetch Toolchain
        run: |
          mkdir toolchain
          cd toolchain
          git clone --depth=1 https://github.com clang

      - name: Fetch Kernel Source
        run: |
          git clone --depth=1 https://github.com kernel-source

      - name: Compile Kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/toolchain/clang/bin:$PATH"
          make O=out eqe_defconfig
          make -j$(nproc --all) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Edge-50-Pro-Kernel
          path: kernel-source/out/arch/arm64/boot/Image
